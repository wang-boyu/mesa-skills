# Replace every `replace-...` value before use. Optional collections may be
# omitted when they do not apply. Protected values use an access note instead
# of copied content.
# Available locators require a value and may add a nonblank access_note about
# access to the underlying artifact. Protected or unavailable locators omit the
# value and require a nonblank access_note.
schema_version: "1"
runs:
  - id: replace-with-stable-run-id
    status: planned
    model_revision:
      availability: unavailable
      access_note: replace-with-model-revision-status
    configuration:
      scenario: replace-with-scenario-id
      parameters: {}
    environment:
      description: replace-with-reproducible-environment-description
    randomness:
      # fixed_seed uses exactly one seed; seed_set uses one or more. sampled
      # requires seeds, a description, or both. replayed requires a description
      # and may include seeds. not_applicable omits seeds.
      policy: not_applicable
    command:
      availability: unavailable
      access_note: replace-with-command-or-entry-point-status
    analysis_revision:
      availability: unavailable
      access_note: replace-with-analysis-revision-status
